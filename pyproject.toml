[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arterial-sensor-tamper-gnn"
version = "1.0.0"
description = "Telling real congestion from tampered loop detectors with a spatio-temporal graph network on PEMS-BAY."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "torch>=2.2", "networkx>=3.2", "pydantic>=2.6,<3",
                "matplotlib>=3.8", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sensorguard = "sensorguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
